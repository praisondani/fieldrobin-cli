name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install package dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Verify release version and package contents
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match package version v${version}."
            exit 1
          fi
          npm pack --dry-run

      - name: Test
        run: npm test

      - name: Publish with provenance
        # Prefer Trusted Publishing (OIDC) configured on npmjs.com for this
        # repo + workflow. NODE_AUTH_TOKEN is only a migration fallback.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
